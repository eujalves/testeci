<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibrosync</title>
</head>

<body>
    <main>
        <div class="container">
            <h1>Crie sua conta</h1>
            <p class="tagline">Preencha seus dados</p>

            <form id="form-cadastro" action="" method="POST">
                <div class="campo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12.2505 13.8307C8.33752 13.8307 4.90552 16.1327 4.90552 18.7557C4.90552 22.1307 10.4345 22.1307 12.2505 22.1307C14.0665 22.1307 19.5945 22.1307 19.5945 18.7337C19.5945 16.1217 16.1625 13.8307 12.2505 13.8307Z"
                            fill="#C58AC5" />
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M12.2119 11.6423H12.2429C14.9379 11.6423 17.1299 9.45026 17.1299 6.75526C17.1299 4.06126 14.9379 1.86926 12.2429 1.86926C9.54798 1.86926 7.35598 4.06126 7.35598 6.75326C7.34698 9.43926 9.52398 11.6323 12.2119 11.6423Z"
                            fill="#C58AC5" />
                    </svg>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome:" required>
                </div>
                <div class="campo">
                    <svg width="20" height="16" viewBox="0 0 20 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M18 0H2C0.9 0 0.00999999 0.9 0.00999999 2L0 14C0 15.1 0.9 16 2 16H18C19.1 16 20 15.1 20 14V2C20 0.9 19.1 0 18 0ZM18 4L10 9L2 4V2L10 7L18 2V4Z"
                            fill="#FB18AF" />
                    </svg>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Email:" required>
                </div>
                <div class="campo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M7 7V8C5.34315 8 4 9.34315 4 11V19C4 20.6569 5.34315 22 7 22H17C18.6569 22 20 20.6569 20 19V11C20 9.34315 18.6569 8 17 8V7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7ZM12 4C10.3431 4 9 5.34315 9 7V8H15V7C15 5.34315 13.6569 4 12 4ZM14 14C14 14.7403 13.5978 15.3866 13 15.7324V17C13 17.5523 12.5523 18 12 18C11.4477 18 11 17.5523 11 17V15.7324C10.4022 15.3866 10 14.7403 10 14C10 12.8954 10.8954 12 12 12C13.1046 12 14 12.8954 14 14Z"
                            fill="#C58AC5" />
                    </svg>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Senha:" required>
                </br>
                    <input type="checkbox" id="termos" name="Termos" />
                    <label for="termos">Li e concordo com o termo de uso </label>
                </br>
                    <input type="button" id="cadastrar-btn" value="Cadastrar" required>
                </div>
                <div class="side">
                   <img src="/public/img/logo_texto.png" alt="Logo do Fibrosync" class="logo">
                   <h1>Bem-Vindo!💜</h1>
                   <p>Acesse sua conta agora mesmo.</p>
                   </br>
                   <input type="button" id="entrar-btn" value="Entrar" required>
                </div>
            </form>
        </div>
    </main>
</body>
<footer>
</footer>
