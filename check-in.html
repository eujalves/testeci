<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FibroSync - Check-in</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="./js/tailwind-config.js"></script>
    <link rel="stylesheet" href="./css/styles-check-in.css">
</head>

<body class="bg-background text-on-background pb-8 font-body-md antialiased min-h-screen">
    <!-- Top Navigation -->
    <header
        class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#F5F6FA] border-b border-slate-200 shadow-[0_2px_4px_rgba(108,92,231,0.05)]">
        <a href="index.html"
            class="text-[#6C5CE7] hover:bg-slate-100 p-2 rounded-full transition-colors flex items-center justify-center">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="font-h3 text-h3 text-on-surface font-semibold tracking-tight">Fazer Check-in</h1>
        <div class="w-10"></div> <!-- Spacer for centering -->
    </header>

    <main class="pt-24 px-6 max-w-2xl mx-auto space-y-8">
        <!-- Pain Level Section -->
        <section
            class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(108,92,231,0.05)] border border-surface-variant relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-tertiary-fixed-dim to-primary"></div>
            <div class="flex items-center gap-2 mb-6">
                <span class="material-symbols-outlined text-primary"
                    style="font-variation-settings: 'FILL' 1;">vital_signs</span>
                <h2 class="font-h3 text-h3 text-on-surface">Nível de Dor</h2>
            </div>
            <div class="space-y-6">
                <div class="flex justify-between items-end">
                    <span class="font-h2 text-h2 text-primary" id="painValue">6</span>
                    <span class="font-body-md text-body-md text-on-surface-variant" id="painLabel">Moderada</span>
                </div>
                <div class="relative pt-1">
                    <input class="w-full" id="painSlider" max="10" min="0" type="range" value="6" />
                    <div class="flex justify-between text-caption font-caption text-outline mt-2">
                        <span>0 (Sem dor)</span>
                        <span>10 (Máxima)</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Sleep Section -->
            <section
                class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_12px_rgba(108,92,231,0.05)] border border-surface-variant">
                <div class="flex items-center gap-2 mb-4">
                    <span class="material-symbols-outlined text-secondary"
                        style="font-variation-settings: 'FILL' 1;">bedtime</span>
                    <h3 class="font-label-sm text-label-sm text-on-surface">Sono</h3>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectOption(this, 'sleep')"
                        class="sleep-option flex flex-col items-center justify-center p-3 rounded-lg border border-surface-variant hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined text-outline mb-1">sentiment_sad</span>
                        <span class="font-caption text-caption text-on-surface-variant">Ruim</span>
                    </button>
                    <button onclick="selectOption(this, 'sleep')"
                        class="sleep-option flex flex-col items-center justify-center p-3 rounded-lg border-2 border-primary bg-primary-container/10 text-primary transition-colors selected">
                        <span class="material-symbols-outlined mb-1"
                            style="font-variation-settings: 'FILL' 1;">sentiment_neutral</span>
                        <span class="font-caption text-caption font-semibold">Médio</span>
                    </button>
                    <button onclick="selectOption(this, 'sleep')"
                        class="sleep-option flex flex-col items-center justify-center p-3 rounded-lg border border-surface-variant hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined text-outline mb-1">sentiment_satisfied</span>
                        <span class="font-caption text-caption text-on-surface-variant">Bom</span>
                    </button>
                </div>
            </section>

            <!-- Energy Section -->
            <section
                class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_12px_rgba(108,92,231,0.05)] border border-surface-variant">
                <div class="flex items-center gap-2 mb-4">
                    <span class="material-symbols-outlined text-[#eab308]"
                        style="font-variation-settings: 'FILL' 1;">bolt</span>
                    <h3 class="font-label-sm text-label-sm text-on-surface">Energia</h3>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectOption(this, 'energy')"
                        class="energy-option flex flex-col items-center justify-center p-3 rounded-lg border border-surface-variant hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined text-outline mb-1">battery_0_bar</span>
                        <span class="font-caption text-caption text-on-surface-variant">Baixa</span>
                    </button>
                    <button onclick="selectOption(this, 'energy')"
                        class="energy-option flex flex-col items-center justify-center p-3 rounded-lg border border-surface-variant hover:bg-surface-container transition-colors">
                        <span class="material-symbols-outlined text-outline mb-1">battery_4_bar</span>
                        <span class="font-caption text-caption text-on-surface-variant">Média</span>
                    </button>
                    <button onclick="selectOption(this, 'energy')"
                        class="energy-option flex flex-col items-center justify-center p-3 rounded-lg border-2 border-primary bg-primary-container/10 text-primary transition-colors selected">
                        <span class="material-symbols-outlined mb-1"
                            style="font-variation-settings: 'FILL' 1;">battery_full</span>
                        <span class="font-caption text-caption font-semibold">Alta</span>
                    </button>
                </div>
            </section>
        </div>

        <!-- Mood Section -->
        <section
            class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(108,92,231,0.05)] border border-surface-variant">
            <div class="flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-[#ec4899]"
                    style="font-variation-settings: 'FILL' 1;">mood</span>
                <h3 class="font-label-sm text-label-sm text-on-surface">Humor</h3>
            </div>
            <div class="flex justify-between items-center gap-2">
                <button onclick="selectMood(this)"
                    class="mood-btn flex-1 py-3 text-2xl hover:scale-110 transition-transform opacity-50 grayscale hover:grayscale-0 rounded-full">
                    😢</button>
                <button onclick="selectMood(this)"
                    class="mood-btn flex-1 py-3 text-2xl hover:scale-110 transition-transform opacity-50 grayscale hover:grayscale-0 rounded-full">
                    😕</button>
                <button onclick="selectMood(this)"
                    class="mood-btn flex-1 py-3 text-2xl scale-110 bg-surface-container-high rounded-full ring-2 ring-primary selected">
                    😐</button>
                <button onclick="selectMood(this)"
                    class="mood-btn flex-1 py-3 text-2xl hover:scale-110 transition-transform opacity-50 grayscale hover:grayscale-0 rounded-full">
                    🙂</button>
                <button onclick="selectMood(this)"
                    class="mood-btn flex-1 py-3 text-2xl hover:scale-110 transition-transform opacity-50 grayscale hover:grayscale-0 rounded-full">
                    😄</button>
            </div>
        </section>

        <!-- Additional Notes Section -->
        <section
            class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_12px_rgba(108,92,231,0.05)] border border-surface-variant">
            <div class="flex items-center gap-2 mb-4">
                <span class="material-symbols-outlined text-outline">edit_note</span>
                <h3 class="font-label-sm text-label-sm text-on-surface">Notas adicionais <span
                        class="text-outline font-normal">(Opcional)</span></h3>
            </div>
            <textarea
                class="w-full bg-[#F5F6FA] border border-surface-variant rounded-lg p-4 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-white transition-all resize-none placeholder:text-outline"
                placeholder="Como você está se sentindo em mais detalhes? Algum gatilho percebido?" rows="3"></textarea>
        </section>

        <!-- Action Button -->
        <div class="pt-4 pb-8">
            <button
                class="w-full bg-gradient-to-r from-primary to-surface-tint text-on-primary font-label-sm text-label-sm py-4 rounded-xl shadow-[0_4px_14px_rgba(108,92,231,0.3)] hover:shadow-[0_6px_20px_rgba(108,92,231,0.4)] transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <span class="material-symbols-outlined">check_circle</span>
                Salvar Check-in
            </button>
        </div>
    </main>

    <script src="./js/check-in.js"></script>
</body>

</html>
